[project]
name = "rag-kb-qa"
version = "2.0.0"
description = "本地化 RAG 私有知识库问答系统（昇腾 NPU 全本地化）"
requires-python = ">=3.11"
dependencies = [
    "uvicorn==0.39.0",
    "fastapi==0.128.8",
    "pydantic==2.12.5",
    "openai==1.109.1",
    "pandas==2.2.3",
    "tqdm==4.67.1",
    "fastembed==0.7.4",
    "python-dotenv==1.2.1",
    "Flask==3.0.3",
    "Werkzeug==3.0.3",
    "transformers==4.57.1",
    "scikit-learn==1.5.0",
    "langchain-huggingface==0.3.1",
    "datasets==4.5.0",
    "ragas==0.4.3",
    "langchain-openai==0.3.35",
    "langchain==0.3.28",
    "langchain-community==0.3.31",
    "langchain-core==0.3.84",
    "langchain-experimental==0.3.4",
    "langchain-text-splitters==0.3.11",
    "python-docx==1.2.0",
    "requests==2.32.5",
    "rank-bm25==0.2.2",
    "sentence-transformers==3.3.1",
    "faiss-cpu==1.13.0",
    "PyMuPDF==1.26.5",
]

[dependency-groups]
dev = [
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
